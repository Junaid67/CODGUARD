# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Custom NestJS backend app. Webhooks (orders/create, orders/cancelled,
# refunds/create, app/uninstalled, app_subscriptions/update) are registered
# programmatically on install by the backend (ShopifyService.registerWebhooks),
# so they are NOT declared here.

client_id = "bc6e84eda93cbd4d158a8174ac09eb4c"
name = "CODGuard"
application_url = "https://supporters-abstract-hull-super.trycloudflare.com"
embedded = true

[access_scopes]
# write_orders authorizes order tagging (there is no "write_tags" scope).
scopes = "read_orders,write_orders,read_customers,read_fulfillments"
optional_scopes = [ ]
# Our backend implements the classic OAuth grant (auth.begin / auth.callback),
# so use the legacy install flow rather than Shopify-managed installation.
use_legacy_install_flow = true

[auth]
redirect_urls = [ "https://supporters-abstract-hull-super.trycloudflare.com/api/v1/auth/callback" ]

[webhooks]
api_version = "2026-04"

[build]
# With this true, `shopify app dev` rewrites application_url + redirect_urls to
# its tunnel host automatically (keeping the /api/v1/auth/callback path).
automatically_update_urls_on_dev = true
dev_store_url = "codguard-dev-4u3qeq31.myshopify.com"
