<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      App Bridge v4: the api-key meta + CDN script must load BEFORE the app.
      Vite substitutes %VITE_SHOPIFY_API_KEY% from the environment at build time.
      This injects the global `shopify` object used for session tokens + nav.
    -->
    <meta name="shopify-api-key" content="%VITE_SHOPIFY_API_KEY%" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <title>COD Risk Scorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
