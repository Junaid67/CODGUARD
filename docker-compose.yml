services:
  postgres:
    image: postgres:16-alpine
    container_name: codguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cod_risk_scorer
    ports:
      - '5432:5432'
    volumes:
      - codguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cod_risk_scorer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codguard_pgdata:
